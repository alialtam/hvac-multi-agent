# Mosquitto 2.x only accepts connections from the same computer by default.
# For the two-laptop demo it must listen on the network:
#   Windows: copy this file over C:\Program Files\mosquitto\mosquitto.conf
#            then restart the "Mosquitto Broker" service (services.msc)
#   Or run it directly:  mosquitto -c docs\mosquitto.conf -v
listener 1883 0.0.0.0
allow_anonymous true
